server.document-root = "/var/www/public"
server.port = 80
server.bind = "0.0.0.0"
server.pid-file = "/var/run/lighttpd.pid"
server.errorlog = "/var/log/lighttpd/error.log"
server.breakagelog = "/var/log/lighttpd/breakage.log"

server.modules = (
	"mod_indexfile",
	"mod_access",
	"mod_fastcgi",
	"mod_openssl",
	"mod_accesslog"
)

index-file.names = ( "index.html" )

mimetype.assign = (
	".html" => "text/html",
	".htm" => "text/html",
	".css" => "text/css",
	".js" => "application/javascript",
	".json" => "application/json",
	".png" => "image/png",
	".jpg" => "image/jpeg",
	".jpeg" => "image/jpeg",
	".svg" => "image/svg+xml",
	".ico" => "image/x-icon",
	".txt" => "text/plain"
)

# REST API proxied via FastCGI to nylonweb_cgi (cREST routes /rest/*).
fastcgi.server = (
	"/rest" => ((
		"bin-path" => "/usr/bin/nylonweb_cgi",
		"socket" => "/tmp/nylonweb_cgi.sock",
		"check-local" => "disable",
		"max-procs" => 2
	))
)

$SERVER["socket"] == "0.0.0.0:443" {
	ssl.engine = "enable"
	ssl.pemfile = "/etc/lighttpd/ssl/server.pem"
}

accesslog.filename = "/var/log/lighttpd/access.log"

url.access-deny = ( "~", ".inc" )
